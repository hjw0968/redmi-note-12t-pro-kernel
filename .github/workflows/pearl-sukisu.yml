name: pearl SukiSU-Nova (device kernel)

on:
  workflow_dispatch:
    inputs:
      make_anykernel3:
        description: 'Also package an experimental pearl-only AnyKernel3 ZIP (after validating the kernel)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Checkout pearl build project
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install reproducible Clang 12 toolchain and build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-12 lld-12 llvm-12 make bc bison flex libssl-dev libelf-dev \
            python3 python3-distutils python-is-python3 xz-utils cpio tar \
            kmod curl git file binutils patch binutils-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu zip unzip
          mkdir -p "$HOME/llvm12/bin"
          for t in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy \
                   llvm-objdump llvm-readelf llvm-size llvm-strip llvm-ranlib; do
            src="$(command -v "${t}-12" || true)"
            test -n "$src" || { echo "Missing tool ${t}-12"; exit 1; }
            ln -sf "$src" "$HOME/llvm12/bin/$t"
          done
          echo "$HOME/llvm12/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned Xiaomi pearl-s-oss sources
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/pearl-s-oss.tar.gz \
            https://codeload.github.com/MiCode/Xiaomi_Kernel_OpenSource/tar.gz/d96c1a04b701bcf1d39ed1b8ab4b3137ff6490f9
          mkdir -p /tmp/pearl-source-unpacked
          tar -xzf /tmp/pearl-s-oss.tar.gz -C /tmp/pearl-source-unpacked
          src="$(find /tmp/pearl-source-unpacked -mindepth 1 -maxdepth 1 -type d | head -1)"
          test -n "$src" && mv "$src" /tmp/pearl-kernel
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL)' /tmp/pearl-kernel/Makefile

      - name: Integrate SukiSU-Nova main as built-in kernel feature
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/pearl-kernel
          curl -fL --retry 3 \
            https://git.zako.shirkneko.top:20004/shirkneko/SukiSU/raw/branch/main/kernel/setup.sh \
            -o /tmp/sukisu-setup.sh
          bash /tmp/sukisu-setup.sh main
          # The released SukiSU integration is tracked by Git commit metadata.
          # Pin its tested commit in a later revision for long-term reproducibility.
          if [ -L drivers/kernelsu ]; then
            echo "SukiSU source link: $(readlink -f drivers/kernelsu)"
          fi
          test -e drivers/kernelsu/Kconfig || { echo 'SukiSU integration failed'; exit 1; }
          cp "$GITHUB_WORKSPACE/configs/device_kconfig.txt" /tmp/pearl-sukisu.config
          cat >> /tmp/pearl-sukisu.config <<'EOF'
          CONFIG_KSU=y
          # CONFIG_KPM is not set
          # CONFIG_KSU_DEBUG is not set
          EOF

      - name: Build device kernel (image only, ThinLTO + module versioning)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          set -o pipefail
          THIN_LTO=1 TARGET=Image.gz JOBS=2 LOCALVERSION=-pearl-sukisu \
            scripts/build-kernel.sh /tmp/pearl-kernel /tmp/pearl-sukisu.config \
            2>&1 | tee "$GITHUB_WORKSPACE/dist/build.log"
          cfg=/tmp/pearl-kernel/out/.config
          grep -qx 'CONFIG_KSU=y' "$cfg" || { echo 'CONFIG_KSU not built in'; exit 1; }
          grep -qx 'CONFIG_MODVERSIONS=y' "$cfg" || { echo 'CONFIG_MODVERSIONS missing'; exit 1; }
          cp /tmp/pearl-kernel/out/arch/arm64/boot/Image "$GITHUB_WORKSPACE/dist/Image"
          cp /tmp/pearl-kernel/out/arch/arm64/boot/Image.gz "$GITHUB_WORKSPACE/dist/Image.gz"
          cp /tmp/pearl-kernel/out/Module.symvers "$GITHUB_WORKSPACE/dist/Module.symvers"
          cp "$cfg" "$GITHUB_WORKSPACE/dist/kernel.config"
          (cd "$GITHUB_WORKSPACE/dist" && sha256sum Image Image.gz Module.symvers kernel.config > SHA256SUMS)
          { echo 'Device: Redmi Note 12T Pro (pearl)'; \
            echo 'Source: Xiaomi pearl-s-oss d96c1a04b701bcf1d39ed1b8ab4b3137ff6490f9'; \
            echo 'KernelSU: main, CONFIG_KSU=y'; \
            echo 'SUSFS/KPM: disabled'; \
            echo 'Compiler: Clang 12; ThinLTO; MODVERSIONS'; \
            echo 'Device-config baseline: mo2g MIUI 14.0.5 (verify against own 14.0.10)'; } \
            > "$GITHUB_WORKSPACE/dist/BUILD-INFO.txt"

      - name: Optionally package pearl-only AnyKernel3 (EXPERIMENTAL)
        if: ${{ inputs.make_anykernel3 }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git /tmp/pearl-ak3
          cd /tmp/pearl-ak3
          cp "$GITHUB_WORKSPACE/dist/Image.gz" ./Image.gz
          rm -rf ramdisk patch vendor_ramdisk vendor_patch modules
          cat > anykernel.sh <<'EOF'
          ### AnyKernel3 pearl-only kernel replacement
          properties() { '
          kernel.string=pearl SukiSU-Nova (experimental)
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=pearl
          supported.versions=13
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }
          boot_attributes() { :; }
          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          . tools/ak3-core.sh;
          split_boot;
          flash_boot;
          EOF
          rm -f README.md
          zip -r9 "$GITHUB_WORKSPACE/dist/pearl-miui14-sukisu-EXPERIMENTAL-AnyKernel3.zip" . \
            -x '.git/*' '*/.git/*' '*.placeholder' >/dev/null
          unzip -l "$GITHUB_WORKSPACE/dist/pearl-miui14-sukisu-EXPERIMENTAL-AnyKernel3.zip" | grep -E 'anykernel.sh|Image.gz|tools/ak3-core.sh|LICENSE'
          (cd "$GITHUB_WORKSPACE/dist" && sha256sum pearl-miui14-sukisu-EXPERIMENTAL-AnyKernel3.zip >> SHA256SUMS)

      - name: Upload kernel, logs, config and optional experimental zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pearl-sukisu-kernel-${{ github.run_number }}
          path: dist/
          if-no-files-found: warn
          retention-days: 14
